[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-pipeline"
version = "0.1.0"
description = "Public research-pipeline orchestration for evaluation, artifacts, and handoff"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alpha-research @ git+https://github.com/runchengxie/alpha-research.git@d4dcf2ff48aab6a2cec87aa6219b5cab59ddf859",
  "market-data-platform @ git+https://github.com/runchengxie/market-data-platform.git@fb4da36874382b9887fd2a16dfde8a5c83ea43fa",
  "numpy>=1.23",
  "pandas>=2.0,<3",
  "portfolio-backtester @ git+https://github.com/runchengxie/portfolio-backtester.git@e78cd1d1b42f7af6cfbcc64c84ccbbf836f94bc4",
  "pyyaml>=6.0",
]

[project.scripts]
strategy-pipeline = "strategy_pipeline.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "research-code-quality",
  "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["strategy_pipeline", "strategy_pipeline.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
research-code-quality = { git = "https://github.com/runchengxie/research-code-quality.git", rev = "1c754c3" }
