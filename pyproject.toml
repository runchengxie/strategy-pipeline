[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-pipeline"
version = "0.1.0"
description = "Public research-pipeline orchestration for evaluation, artifacts, and handoff"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alpha-research @ git+https://github.com/runchengxie/alpha-research.git@e5b040b57b76b1d4d153ecefdd04ddcc27a772fc",
  "market-data-platform @ git+https://github.com/runchengxie/quant-market-data-platform.git@2e98440890e7af85da394731be55ded720dfd4aa",
  "numpy>=1.23",
  "pandas>=2.0,<4",
  "portfolio-backtester @ git+https://github.com/runchengxie/portfolio-backtester.git@b84e79648df5ab73c2ca9e81cba790d2a2e87aa2",
  "pyyaml>=6.0",
]

[project.scripts]
strategy-pipeline = "strategy_pipeline.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "research-code-quality",
  "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["strategy_pipeline", "strategy_pipeline.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
research-code-quality = { git = "https://github.com/runchengxie/quant-code-quality.git", rev = "1c754c3" }

[tool.uv]
override-dependencies = [
  "research-code-quality @ git+https://github.com/runchengxie/quant-code-quality.git@1c754c3",
  "research-contracts @ git+https://github.com/runchengxie/research-workspace.git@05f39873047a20a935957e3bbe04c62b463e4188#subdirectory=src/research_contracts",
]
