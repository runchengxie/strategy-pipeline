[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-pipeline"
version = "0.1.0"
description = "Public research-pipeline orchestration for evaluation, artifacts, and handoff"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alpha-research @ git+https://github.com/runchengxie/alpha-research.git@5dc5c63aab61e809e37a9806471dfaed35ca3f7d",
  "market-data-platform @ git+https://github.com/runchengxie/market-data-platform.git@826e21eb20b7570f1789a82f44269b75b12a7b3c",
  "numpy>=1.23",
  "pandas>=2.0,<3",
  "portfolio-backtester @ git+https://github.com/runchengxie/portfolio-backtester.git@78c5858bb0490ff73d5d1fb3a38851c797b7dc70",
  "pyyaml>=6.0",
]

[project.scripts]
strategy-pipeline = "strategy_pipeline.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "research-code-quality",
  "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["strategy_pipeline", "strategy_pipeline.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
research-code-quality = { git = "https://github.com/runchengxie/research-code-quality.git", rev = "3ff7580" }
