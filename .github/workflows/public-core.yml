name: Public core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Export reviewed public surface
        run: python scripts/dev/public_surface_export.py --output "$RUNNER_TEMP/public-surface"
      - name: Install public package
        run: python -m pip install "$RUNNER_TEMP/public-surface"
      - name: Run public readiness gate
        run: cd "$RUNNER_TEMP/public-surface" && python scripts/dev/public_readiness.py --strict
      - name: Audit current tree and reachable history
        run: python scripts/dev/history_publication_audit.py --root .
      - name: Run synthetic public core tests
        run: cd "$RUNNER_TEMP/public-surface" && python -m pip install pytest && PYTHONPATH=src python -m pytest tests/control_plane -q
      - name: Run shared code-quality metrics
        run: uvx --from git+https://github.com/runchengxie/research-code-quality.git@1c754c3 research-code-quality --scope src --scope scripts --scope tests --baseline .code-quality-baseline.json --ratchet --json
